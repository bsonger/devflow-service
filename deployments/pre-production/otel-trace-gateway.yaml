apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: devflow
    observability.devflow.io/role: telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devflow-otel-trace-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: devflow-otel-trace-gateway
    app.kubernetes.io/part-of: devflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devflow-otel-trace-gateway-config
  namespace: observability
  labels:
    app.kubernetes.io/name: devflow-otel-trace-gateway
    app.kubernetes.io/part-of: devflow
data:
  relay.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 1024
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 1000
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow-http
            type: latency
            latency:
              threshold_ms: 1000
          - name: sample-success
            type: probabilistic
            probabilistic:
              sampling_percentage: 20

    exporters:
      otlphttp/signoz:
        endpoint: http://signoz-otel-collector.observability.svc.cluster.local:4318
        timeout: 10s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 4096
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces/devflow:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlphttp/signoz]
---
apiVersion: v1
kind: Service
metadata:
  name: devflow-otel-trace-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: devflow-otel-trace-gateway
    app.kubernetes.io/part-of: devflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devflow-otel-trace-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow-otel-trace-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: devflow-otel-trace-gateway
    app.kubernetes.io/part-of: devflow
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: devflow-otel-trace-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devflow-otel-trace-gateway
        app.kubernetes.io/part-of: devflow
    spec:
      serviceAccountName: devflow-otel-trace-gateway
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.151.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/relay.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: devflow-otel-trace-gateway-config
      terminationGracePeriodSeconds: 30
