apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devflow-services-default
  namespace: devflow-pre-production
  labels:
    app.kubernetes.io/name: devflow-services
    app.kubernetes.io/part-of: devflow
    environment: pre-production
spec:
  namespaceSelector:
    matchNames:
      - devflow-pre-production
  selector:
    matchLabels:
      observability.devflow.io/scrape: "true"
      observability.devflow.io/scrape-profile: "default"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
---
